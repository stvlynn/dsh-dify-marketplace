services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: difyai123456
      POSTGRES_DB: dify_plugin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    command: redis-server --requirepass difyai123456
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "difyai123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5002:5002"
      - "5003:5003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5002
      SERVER_KEY: ${SERVER_KEY:-dsh-dify-marketplace-dev-key}
      PLATFORM: local
      GIN_MODE: release
      DB_TYPE: postgresql
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: difyai123456
      REDIS_DB: 0
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_WORKING_PATH: /app/storage/cwd
      DIFY_INNER_API_URL: ${DIFY_INNER_API_URL:-http://host.docker.internal:5714/dify-marketplace}
      DIFY_INNER_API_KEY: ${DIFY_INNER_API_KEY:-dsh-dify-inner-dev-key}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-false}
      PYTHON_ENV_INIT_TIMEOUT: 120
      MAX_PLUGIN_PACKAGE_SIZE: 52428800
    volumes:
      - daemon-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5002/health/check"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  daemon-storage:
